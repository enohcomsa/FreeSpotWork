<mat-card>
  <mat-card-header>
    <mat-card-title>{{ buildingCardVm().name }}</mat-card-title>
    <mat-card-subtitle class="!flex items-end !text-sm">
      <mat-icon class="-ml-2 -mr-1 scale-50">location_on</mat-icon>
      {{ buildingCardVm().address }}
    </mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <mat-list class="!pb-0">
      <mat-list-item class="!p-0">
        <div class="flex justify-between text-xs tracking-tighter">
          <p class="min-w-24">{{ 'BUILDING_CARD.FLOOR' | translate }}</p>
        </div>
      </mat-list-item>

      <mat-divider></mat-divider>

      @for (floor of buildingCardVm().floors; track floor.name; let last = $last) {
        <mat-list-item
          class="!cursor-pointer !p-0"
          (click)="onFloorClick(floor.name)"
          matTooltip="click to see floor"
          matTooltipPosition="right"
          matTooltipShowDelay="300"
        >
          <div class="flex justify-between text-sm tracking-tighter">
            <p class="card-link min-w-24 truncate">
              {{ floor.name }}
            </p>
          </div>
        </mat-list-item>

        @if (!last) {
          <mat-divider></mat-divider>
        }
      } @empty {
        <div class="flex h-12 items-center text-sm">
          {{ 'BUILDING_CARD.NO_FLOOR_MSG' | translate }}
        </div>
      }
    </mat-list>
  </mat-card-content>
</mat-card>
