<mat-card>
  <mat-card-header>
    <mat-card-title>
      <div class="flex items-start gap-4">
        <mat-icon class="primary-icon scale-125">event_available</mat-icon>

        <div class="flex-col">
          <p class="-mt-2 grow text-lg font-bold">
            {{ 'DINAMIC_FORM.' + vm().activityType | translate }}
            <span class="mx-1">:</span>
            {{ vm().subjectName }}
          </p>

          <div class="flex items-center text-sm tracking-tighter">
            <p class="max-w-40 truncate sm:max-w-fit md:max-w-48 lg:max-w-44 xl:max-w-fit">{{ vm().buildingName }}</p>
            <p class="flex flex-nowrap">
              <span class="mx-1">|</span>
              <span class="max-w-28 truncate sm:max-w-fit">{{ vm().floorName }}</span>
              <span class="mx-1">|</span>
            </p>
            <p>{{ vm().roomName }}</p>
          </div>
        </div>
      </div>
    </mat-card-title>
  </mat-card-header>

  <mat-card-content class="!flex flex-col gap-2 !pb-8 !pt-2">
    <mat-divider></mat-divider>

    <div class="flex items-center font-bold">
      <p>{{ vm().date | date: 'EEEE, dd MMM, yyyy' }}<span class="mx-1">|</span></p>
      <p>{{ vm().startHour }}-</p>
      <p>{{ vm().endHour }}</p>
    </div>
  </mat-card-content>

  <mat-card-actions>
    <button mat-flat-button class="w-full" (click)="onReschedule()">
      {{ 'BOOKINGS_PAGE.RESCHEDULE' | translate }}
    </button>
  </mat-card-actions>
</mat-card>
