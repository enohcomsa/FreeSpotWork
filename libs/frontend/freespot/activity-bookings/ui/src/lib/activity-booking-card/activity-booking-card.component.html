<mat-card data-automation-id="booking-card-ui" [attr.data-booking-id]="vm().id">
  <mat-card-header>
    <mat-card-title>
      <div class="flex items-start gap-4">
        <mat-icon class="primary-icon scale-125">event_available</mat-icon>

        <div class="flex-col">
          <p data-automation-id="activity-type" class="-mt-2 grow text-lg font-bold">
            {{ 'DYNAMIC_FORM.' + vm().activityType | translate }}
            <span class="mx-1">:</span>
            <span data-automation-id="subject-name">{{ vm().subjectName }}</span>
          </p>

          <div class="flex items-center text-sm tracking-tighter">
            <p data-automation-id="building-name"
              class="max-w-40 truncate sm:max-w-fit md:max-w-48 lg:max-w-44 xl:max-w-fit">{{ vm().buildingName }}</p>
            <p class="flex flex-nowrap">
              <span class="mx-1">|</span>
              <span data-automation-id="floor-name" class="max-w-28 truncate sm:max-w-fit">{{ vm().floorName }}</span>
              <span class="mx-1">|</span>
            </p>
            <p data-automation-id="room-name">{{ vm().roomName }}</p>
          </div>
        </div>
      </div>
    </mat-card-title>
  </mat-card-header>

  <mat-card-content class="!flex flex-col gap-2 !pb-8 !pt-2">
    <mat-divider></mat-divider>

    <div data-automation-id="booking-slot" class="flex items-center font-bold">
      <p data-automation-id="booking-date">{{ vm().date | date: 'EEEE, dd MMM, yyyy' }}<span class="mx-1">|</span></p>
      <p data-automation-id="start-hour">{{ vm().startHour }}-</p>
      <p data-automation-id="end-hour">{{ vm().endHour }}</p>
    </div>
  </mat-card-content>

  <mat-card-actions>
    <button data-automation-id="reschedule-button" mat-flat-button class="w-full" (click)="onReschedule()">
      {{ 'BOOKINGS_PAGE.RESCHEDULE' | translate }}
    </button>
  </mat-card-actions>
</mat-card>
