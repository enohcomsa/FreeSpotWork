<div class="py-4">
  <div class="flex flex-col gap-3 md:flex-row md:items-center md:gap-4">

    <div class="min-w-0 md:flex-1">
      <p class="font-bold">
        {{ vm().subjectName }}
      </p>

      <p class="font-bold">
        {{ vm().date | date: 'EEEE, dd MMM, yyyy' }} | {{ vm().startHour }}-{{ vm().endHour }}
      </p>

      <p class="text-sm truncate">
        {{ vm().buildingName }} | {{ vm().floorName }} | {{ vm().roomName }}
      </p>
    </div>

    <div class="md:whitespace-nowrap total-spots">
      {{ vm().freeSpots }} free spots
    </div>

    <div class="md:ml-auto">
      <button mat-flat-button class="w-full md:w-auto" (click)="onBook()">
        {{ 'DINAMIC_FORM.BOOK' | translate }}
      </button>
    </div>

  </div>
</div>
