<div  [attr.data-activity-id]="vm().id"  class="py-4">
  <div class="flex flex-col gap-3 md:flex-row md:items-center md:gap-4">

    <div class="min-w-0 md:flex-1">
      <p data-automation-id="subject-name" class="font-bold">
        {{ vm().subjectName }}
      </p>

      <p data-automation-id="booking-date" class="font-bold">
        {{ vm().date | date: 'EEEE, dd MMM, yyyy' }} | {{ vm().startHour }}-{{ vm().endHour }}
      </p>

      <p data-automation-id="booking-location" class="text-sm truncate">
        {{ vm().buildingName }} | {{ vm().floorName }} | {{ vm().roomName }}
      </p>
    </div>

    <div data-automation-id="number-free-spots" class="md:whitespace-nowrap total-spots">
      {{ vm().freeSpots }} {{ 'BOOKING_SEARCH_RESULT.FREE_SPOTS' | translate }}
    </div>

    <div class="md:ml-auto">
      <button data-automation-id="book-button" mat-flat-button class="w-full md:w-auto" (click)="onBook()">
        {{ 'DYNAMIC_FORM.BOOK' | translate }}
      </button>
    </div>

  </div>
</div>
